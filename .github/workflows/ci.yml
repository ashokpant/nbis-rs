name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev pkg-config cmake build-essential
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev pkg-config cmake build-essential
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --verbose

  python:
    name: Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev pkg-config cmake build-essential
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build nbis-python wheel
        run: |
          python -m pip install "maturin>=1.5,<2.0" twine
          maturin build --release --manifest-path Cargo.toml --out dist --strip --locked --auditwheel=skip
          bash ./patch_maturin_wheel.sh
          twine check dist/*.whl
      - name: Run pytest
        run: |
          python -m pip install dist/*.whl
          python -m pip install -r bindings/python/tests/requirements.txt
          cd bindings/python/tests && python -m pytest -v --tb=short
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7
