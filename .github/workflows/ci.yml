name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPENCV_DIR: /usr/local/lib/cmake/opencv4
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
  LD_LIBRARY_PATH: /usr/local/lib

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Cache OpenCV 4.13 (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/cmake/opencv4
            /usr/local/lib/libopencv_*
            /usr/local/lib/pkgconfig/opencv4.pc
            /usr/local/include/opencv4
          key: opencv-4.13.0-linux-${{ runner.arch }}
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo bash ./scripts/install-opencv-4.13-linux.sh
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Cache OpenCV 4.13 (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/cmake/opencv4
            /usr/local/lib/libopencv_*
            /usr/local/lib/pkgconfig/opencv4.pc
            /usr/local/include/opencv4
          key: opencv-4.13.0-linux-${{ runner.arch }}
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo bash ./scripts/install-opencv-4.13-linux.sh
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --verbose

  python:
    name: Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Cache OpenCV 4.13 (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/cmake/opencv4
            /usr/local/lib/libopencv_*
            /usr/local/lib/pkgconfig/opencv4.pc
            /usr/local/include/opencv4
          key: opencv-4.13.0-linux-${{ runner.arch }}
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo bash ./scripts/install-opencv-4.13-linux.sh && sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - name: Build nbis-python wheel
        env:
          OPENCV_DIR: /usr/local/lib/cmake/opencv4
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          python -m pip install "maturin>=1.5,<2.0" twine
          chmod +x scripts/*.sh build_python_linux.sh
          if [ "$(uname -s)" = "Darwin" ]; then
            export OPENCV_DIR="$(brew --prefix opencv)/lib/cmake/opencv4"
          fi
          NBIS_SKIP_HOST_DEPS=1 bash ./scripts/build-python-wheel.sh
      - name: Run pytest
        run: |
          python -m pip install dist/*.whl
          python -m pip install -r bindings/python/tests/requirements.txt
          cd bindings/python/tests && python -m pytest -v --tb=short
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7
