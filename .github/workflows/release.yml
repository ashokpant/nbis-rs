name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release-notes:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            git log "${prev}..HEAD" --pretty=format:"%h %s" > /tmp/release-notes.txt
          else
            git log -20 --pretty=format:"%h %s" > /tmp/release-notes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.txt
          draft: false
          prerelease: false

  wheels:
    name: Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev pkg-config cmake build-essential
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          pip install "maturin>=1.5,<2.0" twine
          maturin build --release --out dist --locked --auditwheel=skip
          bash ./patch_maturin_wheel.sh
          twine check dist/nbis_py*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.os }}
          path: dist/*.whl
