name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"%h %s" > /tmp/release-notes.txt
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: /tmp/release-notes.txt
          draft: false
          prerelease: false

  build-wheels:
    name: Build Python Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
