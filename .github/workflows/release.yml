# Tag v*.*.* → build wheels and attach to GitHub Release (no PyPI; publish locally with make publish).

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENCV_DIR: /usr/local/lib/cmake/opencv4
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
  LD_LIBRARY_PATH: /usr/local/lib

jobs:
  wheels:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v5
      - name: Cache OpenCV 4.13 (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/cmake/opencv4
            /usr/local/lib/libopencv_*
            /usr/local/lib/pkgconfig/opencv4.pc
            /usr/local/include/opencv4
          key: opencv-4.13.0-linux-${{ runner.arch }}
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo bash ./scripts/install-opencv-4.13-linux.sh && sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - name: Build nbis-python wheel
        run: |
          python -m pip install "maturin>=1.5,<2.0" twine
          chmod +x scripts/*.sh
          if [ "$(uname -s)" = "Darwin" ]; then
            export OPENCV_DIR="$(brew --prefix opencv)/lib/cmake/opencv4"
          fi
          NBIS_SKIP_HOST_DEPS=1 bash ./scripts/build-python-wheel.sh
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl

  github-release:
    name: GitHub Release
    needs: [wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            git log "${prev}..HEAD" --pretty=format:"%h %s" > /tmp/release-notes.txt
          else
            git log -20 --pretty=format:"%h %s" > /tmp/release-notes.txt
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.txt
          files: dist/*.whl
          draft: false
          prerelease: false
