# Upload nbis-python wheels to PyPI when a version tag is pushed.
# Requires repository secret: PYPI_API_TOKEN

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  OPENCV_DIR: /usr/local/lib/cmake/opencv4
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
  LD_LIBRARY_PATH: /usr/local/lib

jobs:
  build-wheels:
    name: Wheel (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # macOS CI may fail on Homebrew OpenCV; Linux wheels are the critical publish path.
    continue-on-error: ${{ matrix.label == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@v5
      - name: Cache OpenCV 4.13 (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/cmake/opencv4
            /usr/local/lib/libopencv_*
            /usr/local/lib/pkgconfig/opencv4.pc
            /usr/local/include/opencv4
          key: opencv-4.13.0-linux-${{ runner.arch }}
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo bash ./scripts/install-opencv-4.13-linux.sh && sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv pkg-config cmake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          python -m pip install "maturin>=1.5,<2.0" twine
          chmod +x scripts/*.sh
          if [ "$(uname -s)" = "Darwin" ]; then
            export OPENCV_DIR="$(brew --prefix opencv)/lib/cmake/opencv4"
          fi
          NBIS_SKIP_HOST_DEPS=1 bash ./scripts/build-python-wheel.sh
      - uses: actions/upload-artifact@v5
        with:
          name: pypi-wheel-${{ matrix.label }}
          path: dist/nbis_python*.whl

  publish-pypi:
    name: Upload to PyPI
    needs: [build-wheels]
    if: ${{ always() && (needs.build-wheels.result == 'success' || needs.build-wheels.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/nbis-python/
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: pypi-wheel-*
          merge-multiple: true

      - name: Require at least one wheel
        run: |
          ls -lh dist/ || true
          test -n "$(ls dist/nbis_python*.whl 2>/dev/null)" || {
            echo "No wheels uploaded from build jobs" >&2
            exit 1
          }

      - name: Twine check
        run: pip install twine && twine check dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Prefer API token when present; otherwise trusted publishing (OIDC).
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
