[project]
name = "nbis-python"
version = "0.1.15"
description = "Python bindings for NBIS fingerprint processing using Rust + UniFFI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Varun Chatterji", email = "varun@seventhsense.ai" }
]
keywords = ["fingerprint", "nbis", "biometrics", "rust", "uniffi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Seventh-Sense-Artificial-Intelligence/nbis-rs"
Repository = "https://github.com/Seventh-Sense-Artificial-Intelligence/nbis-rs"
Documentation = "https://github.com/Seventh-Sense-Artificial-Intelligence/nbis-rs"
"Bug Tracker" = "https://github.com/Seventh-Sense-Artificial-Intelligence/nbis-rs/issues"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "bindings/python/nbis-python"
module-name = "nbis"
bindings = "uniffi"
include = ["LICENSE"]
# Delocate/auditwheel off; Linux OpenCV vendoring in scripts/build-python-wheel.sh.
compatibility = "manylinux_2_28"
auditwheel = "skip"

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 120
py_version = 310

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false